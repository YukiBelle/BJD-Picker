<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Sets - BJD Picker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">BJD Picker</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="new.html" class="nav-link active">NEW</a></li>
                <li><a href="popular.html" class="nav-link">Popular</a></li>
                <li><a href="about.html" class="nav-link">About Us</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <h1>Newly Added Sets</h1>
            <p>Check out the latest BJD collections</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-box" 
                    placeholder="Search for a set..."
                >
                <button id="clearBtn" class="clear-btn">Clear</button>
            </div>
            <div id="search-results-info" class="search-results-info"></div>
        </div>

        <!-- New Sets Section -->
        <section class="sets-section">
            <div id="newSetsContainer" class="sets-grid">
                <!-- New sets will be loaded here -->
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 BJD Picker. All rights reserved.</p>
    </footer>

    <!-- Modal/Popup for full set view -->
    <div id="setModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <div class="modal-image-container">
                    <img id="modalImage" src="" alt="Full Set View">
                </div>
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <p id="modalDescription"></p>
                    <div class="modal-characters">
                        <div class="characters-label">Characters in Set:</div>
                        <div id="modalCharacterList" class="character-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Load new sets on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadNewSets();
        });
    </script>
</body>
</html>
